name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
  push:
    branches:
      - master

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  swiftformat:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        env:
          MISE_DISABLE_TOOLS: ruby

      - name: Show Swift version
        run: swift --version

      - name: Run swift-format
        run: mise run lint
        env:
          MISE_DISABLE_TOOLS: ruby

  swiftlint:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        env:
          MISE_DISABLE_TOOLS: ruby

      # The swiftlint binary needs libxml2.so.2, which is missing on ubuntu-26.04
      - name: Run SwiftLint
        run: mise exec github:realm/SwiftLint@latest -- swiftlint-static --strict
        env:
          MISE_DISABLE_TOOLS: ruby

  build:
    needs: [swiftformat, swiftlint]
    if: github.event.pull_request.draft == false
    runs-on: xcode-27
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set Xcode version
        uses: ./.github/actions/setup-xcode

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: jdx/mise-action@v5
        env:
          MISE_DISABLE_TOOLS: ruby

      - uses: irgaly/xcode-cache@v1
        with:
          key: xcode-cache-deriveddata-${{ github.job }}-${{ github.workflow }}-${{ github.sha }}
          restore-keys: xcode-cache-deriveddata-${{ github.job }}-${{ github.workflow }}-
          swiftpm-cache-key: xcode-cache-sourcepackages-${{ github.workflow }}-${{ github.sha }}
          swiftpm-cache-restore-keys: xcode-cache-sourcepackages-${{ github.workflow }}-

      - name: Setup GoogleService-Info.plist
        run: |
          cp FirstTask/Configs/GoogleService-Info-Release.plist.sample FirstTask/Configs/GoogleService-Info-Release.plist

      - name: Build
        run: mise run build
        env:
          LICENSE_PLIST_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISE_DISABLE_TOOLS: ruby

  test:
    needs: [swiftformat, swiftlint]
    if: github.event.pull_request.draft == false
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Temporary: sample CPU/IO load during the job to find out why the test job is slow
      - name: Start load sampler
        run: |
          echo "hw.ncpu: $(sysctl -n hw.ncpu), hw.memsize: $(sysctl -n hw.memsize)"
          cat > "$RUNNER_TEMP/load-sampler.sh" <<'EOF'
          while true; do
            echo "===== $(date -u +%H:%M:%S) loadavg: $(sysctl -n vm.loadavg)"
            echo "processes: $(ps -A | wc -l)"
            ps -Ao pid,pcpu,pmem,state,comm -r | head -n 11
            iostat -d -c 2 -w 1 | sed -n '1,2p;$p'
            memory_pressure | tail -n 1
            sleep 10
          done
          EOF
          nohup bash "$RUNNER_TEMP/load-sampler.sh" > "$RUNNER_TEMP/load-sampler.log" 2>&1 < /dev/null &

      - name: Set Xcode version
        uses: ./.github/actions/setup-xcode

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: jdx/mise-action@v5
        env:
          MISE_DISABLE_TOOLS: ruby

      - uses: irgaly/xcode-cache@v1
        with:
          key: xcode-cache-deriveddata-${{ github.job }}-${{ github.workflow }}-${{ github.sha }}
          restore-keys: xcode-cache-deriveddata-${{ github.job }}-${{ github.workflow }}-
          swiftpm-cache-key: xcode-cache-sourcepackages-${{ github.workflow }}-${{ github.sha }}
          swiftpm-cache-restore-keys: xcode-cache-sourcepackages-${{ github.workflow }}-

      - name: Setup GoogleService-Info.plist
        run: |
          cp FirstTask/Configs/GoogleService-Info-Release.plist.sample FirstTask/Configs/GoogleService-Info-Release.plist

      - name: Select simulator
        id: select_simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | jq -r '
            .devices
            | to_entries
            | map(select(.key | contains("com.apple.CoreSimulator.SimRuntime.iOS")))
            | max_by(.key)
            | .value
            | .[]
            | select(.name | startswith("iPhone"))
            | .udid
          ' | head -n 1)
          echo "Selected simulator: $DEVICE_ID"
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      # Build before the simulator boots: a booted simulator saturates the runner
      # and slows down everything else, including SPM resolution and compilation
      - name: Build for testing
        run: mise run build-for-testing --destination "id=$DEVICE_ID"
        env:
          DEVICE_ID: ${{ steps.select_simulator.outputs.device_id }}
          LICENSE_PLIST_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISE_DISABLE_TOOLS: ruby

      # https://github.com/actions/runner-images/issues/12777
      - name: Workaround for hanging simulator
        timeout-minutes: 12
        run: |
          brew install coreutils -q

          echo "--------------------------------"
          echo "👀 Updating dyld_shared_cache:"
          xcrun simctl runtime dyld_shared_cache update --all
          echo "--------------------------------"
          echo "👀 Booting simulator: with ID: $DEVICE_ID"

          i=1
          max=5
          while [ $i -le $max ]; do
            echo "👀 Launching Simulator (Attempt $i/$max)"
            # Brewfile installs coreutils which includes gtimeout
            if gtimeout -s SIGKILL 2m xcrun simctl bootstatus "$DEVICE_ID" -b; then
              echo "✅ Simulator booted successfully"
              break
            else
              echo "❌ Simulator boot timed out. Shutting down..."
              xcrun simctl shutdown "$DEVICE_ID" || true # prevents "Unable to shutdown device in current state: Shutdown" error

              echo "🔁 Retrying in 5s..."
              i=$((i + 1))
              sleep 5
            fi
          done

          if [ $i -gt $max ]; then
            echo "::error::Failed to boot simulator after $max attempts."
            exit 1
          fi
        env:
          DEVICE_ID: ${{ steps.select_simulator.outputs.device_id }}

      # The booted simulator saturates the runner, so call xcodebuild directly
      # with the .xctestrun file to skip mise, bundler, fastlane and project loading
      - name: Test
        timeout-minutes: 15
        run: |
          XCTESTRUN=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/FirstTask-*/Build/Products/*.xctestrun' -print0 | xargs -0 ls -t | head -n 1)
          echo "Using $XCTESTRUN"
          set -o pipefail
          xcodebuild test-without-building -xctestrun "$XCTESTRUN" -destination "id=$DEVICE_ID" | xcbeautify --renderer github-actions
        env:
          DEVICE_ID: ${{ steps.select_simulator.outputs.device_id }}

      - name: Show load sampler log
        if: always()
        run: cat "$RUNNER_TEMP/load-sampler.log" || true

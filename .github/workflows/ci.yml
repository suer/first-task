name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
  push:
    branches:
      - master

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  swiftformat:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        env:
          MISE_DISABLE_TOOLS: ruby

      - name: Show Swift version
        run: swift --version

      - name: Run swift-format
        run: mise run lint
        env:
          MISE_DISABLE_TOOLS: ruby

  swiftlint:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        env:
          MISE_DISABLE_TOOLS: ruby

      # The swiftlint binary needs libxml2.so.2, which is missing on ubuntu-26.04
      - name: Run SwiftLint
        run: mise exec github:realm/SwiftLint@latest -- swiftlint-static --strict
        env:
          MISE_DISABLE_TOOLS: ruby

  build:
    needs: [swiftformat, swiftlint]
    if: github.event.pull_request.draft == false
    runs-on: xcode-27
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set Xcode version
        uses: ./.github/actions/setup-xcode

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: jdx/mise-action@v5
        env:
          MISE_DISABLE_TOOLS: ruby

      - uses: irgaly/xcode-cache@v1
        with:
          key: xcode-cache-deriveddata-${{ github.job }}-${{ github.workflow }}-${{ github.sha }}
          restore-keys: xcode-cache-deriveddata-${{ github.job }}-${{ github.workflow }}-
          swiftpm-cache-key: xcode-cache-sourcepackages-${{ github.workflow }}-${{ github.sha }}
          swiftpm-cache-restore-keys: xcode-cache-sourcepackages-${{ github.workflow }}-

      - name: Setup GoogleService-Info.plist
        run: |
          cp FirstTask/Configs/GoogleService-Info-Release.plist.sample FirstTask/Configs/GoogleService-Info-Release.plist

      - name: Build
        run: mise run build
        env:
          LICENSE_PLIST_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISE_DISABLE_TOOLS: ruby

  test:
    needs: [swiftformat, swiftlint]
    if: github.event.pull_request.draft == false
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
    # Experiment: compare the warm simulator with and without the widget services
    strategy:
      fail-fast: false
      matrix:
        variant: [warm, warm-widgets-off, fresh-widgets-off]
    steps:
      - uses: actions/checkout@v7

      # Experiment: sample CPU load during the job
      - name: Start load sampler
        run: |
          echo "hw.ncpu: $(sysctl -n hw.ncpu), hw.memsize: $(sysctl -n hw.memsize)"
          cat > "$RUNNER_TEMP/load-sampler.sh" <<'EOF'
          while true; do
            echo "===== $(date -u +%H:%M:%S) loadavg: $(sysctl -n vm.loadavg)"
            echo "processes: $(ps -A | wc -l)"
            ps -Ao pid,pcpu,pmem,state,comm -r | head -n 11
            memory_pressure | tail -n 1
            sleep 10
          done
          EOF
          nohup bash "$RUNNER_TEMP/load-sampler.sh" > "$RUNNER_TEMP/load-sampler.log" 2>&1 < /dev/null &

      - name: Set Xcode version
        uses: ./.github/actions/setup-xcode

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: jdx/mise-action@v5
        env:
          MISE_DISABLE_TOOLS: ruby

      - uses: irgaly/xcode-cache@v1
        with:
          key: xcode-cache-deriveddata-${{ github.job }}-${{ github.workflow }}-${{ github.sha }}
          restore-keys: xcode-cache-deriveddata-${{ github.job }}-${{ github.workflow }}-
          swiftpm-cache-key: xcode-cache-sourcepackages-${{ github.workflow }}-${{ github.sha }}
          swiftpm-cache-restore-keys: xcode-cache-sourcepackages-${{ github.workflow }}-

      - name: Setup GoogleService-Info.plist
        run: |
          cp FirstTask/Configs/GoogleService-Info-Release.plist.sample FirstTask/Configs/GoogleService-Info-Release.plist

      - name: Select simulator
        id: select_simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | jq -r '
            .devices
            | to_entries
            | map(select(.key | contains("com.apple.CoreSimulator.SimRuntime.iOS")))
            | max_by(.key)
            | .value
            | .[]
            | select(.name | startswith("iPhone"))
            | .udid
          ' | head -n 1)
          echo "Selected simulator: $DEVICE_ID"
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          RUNTIME=$(xcrun simctl list devices -j | jq -r --arg id "$DEVICE_ID" '.devices | to_entries[] | select(any(.value[]; .udid == $id)) | .key')
          echo "warm_simulator_cache_key=warm-simulator-v1-$ImageVersion-$RUNTIME-$DEVICE_ID" >> "$GITHUB_OUTPUT"

      # Build before the simulator boots: a booted simulator saturates the runner
      # and slows down everything else, including SPM resolution and compilation
      - name: Build for testing
        id: build_for_testing
        run: |
          mise run build-for-testing --destination "id=$DEVICE_ID"
          XCTESTRUN=""
          for f in "$HOME"/Library/Developer/Xcode/DerivedData/FirstTask-*/Build/Products/*.xctestrun; do
            if [ -z "$XCTESTRUN" ] || [ "$f" -nt "$XCTESTRUN" ]; then
              XCTESTRUN=$f
            fi
          done
          echo "Using $XCTESTRUN"
          echo "xctestrun=$XCTESTRUN" >> "$GITHUB_OUTPUT"
        env:
          DEVICE_ID: ${{ steps.select_simulator.outputs.device_id }}
          LICENSE_PLIST_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISE_DISABLE_TOOLS: ruby

      # A fresh simulator spends minutes on first-boot initialization (data migration,
      # widget setup, indexing, etc.). Restore the data directory of a simulator that has
      # already finished it.
      - name: Restore warm simulator data
        id: restore_warm_simulator
        if: matrix.variant != 'fresh-widgets-off'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/warm-simulator-data
          key: ${{ steps.select_simulator.outputs.warm_simulator_cache_key }}

      - name: Apply warm simulator data
        if: steps.restore_warm_simulator.outputs.cache-hit == 'true'
        run: rsync -a --delete "$RUNNER_TEMP/warm-simulator-data/" "$HOME/Library/Developer/CoreSimulator/Devices/$DEVICE_ID/data/"
        env:
          DEVICE_ID: ${{ steps.select_simulator.outputs.device_id }}

      # Experiment: disable the widget and wallpaper services before the boot by writing
      # the launchd disable overrides that launchd_sim reads at startup (same labels as
      # simslim's "widgets" category)
      - name: Disable widget services
        if: endsWith(matrix.variant, 'widgets-off')
        run: |
          STORE_DIR="/private/var/tmp/com.apple.CoreSimulator.SimDevice.$DEVICE_ID"
          STORE="$STORE_DIR/disabled.plist"
          mkdir -p "$STORE_DIR"
          for label in com.apple.PosterBoard com.apple.chronod com.apple.liveactivitiesd com.apple.navd; do
            /usr/libexec/PlistBuddy -c "Set :$label true" "$STORE" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :$label bool true" "$STORE"
          done
          cat "$STORE"
        env:
          DEVICE_ID: ${{ steps.select_simulator.outputs.device_id }}

      # https://github.com/actions/runner-images/issues/12777
      - name: Workaround for hanging simulator
        timeout-minutes: 12
        run: |
          brew install coreutils -q

          echo "--------------------------------"
          echo "👀 Updating dyld_shared_cache:"
          xcrun simctl runtime dyld_shared_cache update --all
          echo "--------------------------------"
          echo "👀 Booting simulator: with ID: $DEVICE_ID"

          i=1
          max=5
          while [ $i -le $max ]; do
            echo "👀 Launching Simulator (Attempt $i/$max)"
            # Brewfile installs coreutils which includes gtimeout
            if gtimeout -s SIGKILL 2m xcrun simctl bootstatus "$DEVICE_ID" -b; then
              echo "✅ Simulator booted successfully"
              break
            else
              echo "❌ Simulator boot timed out. Shutting down..."
              xcrun simctl shutdown "$DEVICE_ID" || true # prevents "Unable to shutdown device in current state: Shutdown" error

              echo "🔁 Retrying in 5s..."
              i=$((i + 1))
              sleep 5
            fi
          done

          if [ $i -gt $max ]; then
            echo "::error::Failed to boot simulator after $max attempts."
            exit 1
          fi
        env:
          DEVICE_ID: ${{ steps.select_simulator.outputs.device_id }}

      # The booted simulator saturates the runner, so call xcodebuild directly
      # with the .xctestrun file to skip mise, bundler, fastlane and project loading
      - name: Test
        timeout-minutes: 15
        run: |
          set -o pipefail
          xcodebuild test-without-building -xctestrun "$XCTESTRUN" -destination "id=$DEVICE_ID" | xcbeautify --renderer github-actions
        env:
          DEVICE_ID: ${{ steps.select_simulator.outputs.device_id }}
          XCTESTRUN: ${{ steps.build_for_testing.outputs.xctestrun }}

      # Shut down the simulator so that the cache is saved on an idle runner
      # Experiment: check that launchd_sim honoured the overrides (after the tests, to keep
      # the measurement clean)
      - name: Show disabled widget services
        if: always()
        run: xcrun simctl spawn "$DEVICE_ID" launchctl print-disabled system | grep -E 'PosterBoard|chronod|liveactivitiesd|navd' || true
        env:
          DEVICE_ID: ${{ steps.select_simulator.outputs.device_id }}

      - name: Shutdown simulator
        if: always()
        run: xcrun simctl shutdown all

      # Save only on master to keep the cache usage low; pull requests restore it from master
      - name: Copy simulator data for the warm cache
        if: github.ref == 'refs/heads/master' && steps.restore_warm_simulator.outputs.cache-hit != 'true'
        run: rsync -a "$HOME/Library/Developer/CoreSimulator/Devices/$DEVICE_ID/data/" "$RUNNER_TEMP/warm-simulator-data/"
        env:
          DEVICE_ID: ${{ steps.select_simulator.outputs.device_id }}

      - name: Save warm simulator data
        if: github.ref == 'refs/heads/master' && steps.restore_warm_simulator.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/warm-simulator-data
          key: ${{ steps.select_simulator.outputs.warm_simulator_cache_key }}

      - name: Show load sampler log
        if: always()
        run: cat "$RUNNER_TEMP/load-sampler.log" || true
